---
- defaults:
    create:
      mode: 0755
    link:
      create: true
      relink: true
      exclude: ["*.md", "*renovate*", "LICENSE"]
    shell:
      stdout: true
      # dotbot connects a shell step's stderr to /dev/null by default
      # (tools/dotbot/README.md, `stderr`). The install steps report warnings
      # and failures on stderr (msgr warn/err), so without this a partial
      # install printed nothing about what failed.
      stderr: true
