---
# ./install runs tools/dotbot-defaults.yaml ahead of this file.
- shell:
    - echo "Configuring s"
- link:
    ~/:
      force: true
      glob: true
      path: hosts/s/base/**
      prefix: "."
    ~/.config/:
      glob: true
      force: true
      path: hosts/s/config/**
- shell:
    # A full install's mise step runs before this overlay, so it never saw the
    # host.toml linked above. ./install --links skips shell steps.
    - bash local/bin/dfm install mise
