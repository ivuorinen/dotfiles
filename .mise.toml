[tools]
node = "26.12.1"
python = "3.14"
go = "1.27.2"
dotnet = "10"

# The `mise run lint` toolchain. These are also pinned in
# config/mise/config.toml (the global config, symlinked to ~/.config/mise/),
# which is what provides them on a workstation. CI checks out the repo and
# never sees that file, so the gate needs them here too — renovate tracks both
# copies.
biome = "2.5.15"
editorconfig-checker = "4.0.2"
usage = "7.1.0"
"npm:prettier" = "3.9.10"
"npm:markdownlint-cli" = "0.49.1"
"npm:markdown-table-formatter" = "1.7.0"
"npm:v8r" = "6.1.0"
# `lint-bandit` is part of the `lint` chain, so the CI gate needs bandit even
# though no other job uses Python. The [toml] extra is required: without it
# bandit cannot read [tool.bandit] out of pyproject.toml and silently falls
# back to defaults, which would fail the gate on the accepted B607 findings.
"pipx:bandit[toml]" = "1.9.4"

# The pre-commit hooks run these through `mise exec --`, so the hook and an
# interactive shell always run the same version. Same pins as
# config/mise/config.toml.
shellcheck = "0.11.0"
shfmt = "3.14.1"
yamllint = "1.38.0"
ruff = "0.17.1"
actionlint = "1.7.12"
zizmor = "1.31.1"
gitleaks = "8.30.1"

# The hook runner and the test runner that .github/CONTRIBUTING.md tells a
# contributor to use. Same pins as config/mise/config.toml, so `mise install`
# in a fresh clone provides them without linking the global config into ~.
bats = "1.14.0"
prek = "0.5.5"
stylua = "latest"

# What the bats suite needs beyond bats itself; the Tests workflow installs
# them by name through install_args. Same pins as config/mise/config.toml.
uv = "0.13.1"
age = "1.3.2"
tmux = "3.7c"

# Quality gates are file tasks in .mise/tasks/, one script per task (`mise
# tasks` lists them). `mise run lint` is what CI and the Stop hook run.
