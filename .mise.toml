[tools]
node = "26.8.1"
python = "3.14"
go = "1.27.0"
dotnet = "10"

# The `yarn lint` toolchain. These are also pinned in config/mise/config.toml
# (the global config, symlinked to ~/.config/mise/), which is what provides
# them on a workstation. CI checks out the repo and never sees that file, so
# the gate needs them here too — renovate tracks both copies.
biome = "2.5.10"
editorconfig-checker = "3.11.2"
usage = "6.5.0"
"npm:prettier" = "3.9.6"
"npm:markdownlint-cli" = "0.49.1"
"npm:markdown-table-formatter" = "1.7.0"
"npm:v8r" = "6.1.0"
# `yarn lint:bandit` is part of the `lint` chain, so the CI gate needs bandit
# even though no other job uses Python. The [toml] extra is required: without
# it bandit cannot read [tool.bandit] out of pyproject.toml and silently falls
# back to defaults, which would fail the gate on the accepted B607 findings.
"pipx:bandit[toml]" = "1.9.4"
