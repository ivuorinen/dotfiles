[tools]
node = "26.12.0"
python = "3.15.0"
go = "1.27.2"
dotnet = "10"

# The `mise run lint` toolchain. These are also pinned in
# config/mise/config.toml (the global config, symlinked to ~/.config/mise/),
# which is what provides them on a workstation. CI checks out the repo and
# never sees that file, so the gate needs them here too — renovate tracks both
# copies.
biome = "2.5.15"
editorconfig-checker = "4.0.2"
usage = "7.0.1"
"npm:prettier" = "3.9.10"
"npm:markdownlint-cli" = "0.49.1"
"npm:markdown-table-formatter" = "1.7.0"
"npm:v8r" = "6.1.0"
# `lint-bandit` is part of the `lint` chain, so the CI gate needs bandit even
# though no other job uses Python. The [toml] extra is required: without it
# bandit cannot read [tool.bandit] out of pyproject.toml and silently falls
# back to defaults, which would fail the gate on the accepted B607 findings.
"pipx:bandit[toml]" = "1.9.4"

# The pre-commit hooks run these through `mise exec --`, so the hook and an
# interactive shell always run the same version. Same pins as
# config/mise/config.toml.
shellcheck = "0.11.0"
shfmt = "3.14.1"
yamllint = "1.38.0"
ruff = "0.17.1"
actionlint = "1.7.12"
zizmor = "1.31.1"
gitleaks = "8.30.1"

# The hook runner and the test runner that .github/CONTRIBUTING.md tells a
# contributor to use. Same pins as config/mise/config.toml, so `mise install`
# in a fresh clone provides them without linking the global config into ~.
bats = "1.14.0"
prek = "0.5.5"
stylua = "latest"

# Quality gates. `mise run lint` is what CI and the Stop hook run; `mise tasks`
# lists everything here. Each chain runs its steps in order and stops at the
# first failure.

[tasks.lint]
description = "Run every lint step, in order"
run = [
  { task = "lint-biome" },
  { task = "lint-prettier" },
  { task = "lint-ec" },
  { task = "lint-md-table" },
  { task = "lint-markdownlint" },
  { task = "lint-v8r" },
  { task = "lint-usage" },
  { task = "lint-bandit" },
  { task = "lint-exclusions" },
]

[tasks.lint-biome]
description = "Biome check (JS/TS/JSON/Markdown)"
run = "biome check ."

[tasks.lint-prettier]
description = "Prettier check (YAML)"
run = "prettier --check '**/*.{yml,yaml}'"

[tasks.lint-ec]
description = "EditorConfig checker"
run = "editorconfig-checker -f gcc"

[tasks.lint-md-table]
description = "Markdown table formatting check"
run = "local/bin/git-ls-existing -z --cached --others --exclude-standard '*.md' | grep -zv '^docs/audit/findings/' | xargs -0 markdown-table-formatter --check"

[tasks.lint-markdownlint]
description = "markdownlint (honors .markdownlintignore)"
run = "markdownlint --ignore-path .markdownlintignore '**/*.md'"

[tasks.lint-v8r]
description = "JSON Schema validation of schema-backed configs"
run = "local/bin/git-ls-existing -z --cached --others --exclude-standard '*.yml' '*.yaml' '*.json' '*.toml' | grep -zvE '^(tools/|config/cheat/cheatsheets/|config/gh/|config/gh-dash/|node_modules/|graphify-out/|docs/audit/|\\.claude/skills/graphify/)' | xargs -0 v8r --ignore-errors"

[tasks.lint-usage]
description = "usage lint for scripts/ and local/bin/"
shell = "bash -c"
run = '''
rc=0
for f in scripts/*.sh; do usage lint "$f" || rc=1; done
for f in $(grep -rl "#USAGE\|//USAGE" local/bin/ 2> /dev/null | grep -Ev "\.(py|pl|php|md)$"); do
  usage lint "$f" || rc=1
done
exit $rc
'''

[tasks.lint-bandit]
description = "Python SAST (config in [tool.bandit], pyproject.toml)"
run = "bandit -c pyproject.toml --ini .bandit -r . -q"

[tasks.lint-exclusions]
description = "Third-party exclusion lists agree across gates"
run = "./scripts/check-exclusion-drift.py"

[tasks.fix]
description = "Run every autofixer, in order"
run = [
  { task = "fix-biome" },
  { task = "fix-prettier" },
  { task = "fix-md-table" },
]

[tasks.fix-biome]
description = "Autofix with Biome (JS/TS/JSON/Markdown)"
run = "biome check --write ."

[tasks.fix-prettier]
description = "Autofix YAML with Prettier"
alias = "format-yaml"
run = "prettier --write '**/*.{yml,yaml}'"

[tasks.fix-md-table]
description = "Fix Markdown table formatting"
run = "local/bin/git-ls-existing -z --cached --others --exclude-standard '*.md' | grep -zv '^docs/audit/findings/' | xargs -0 markdown-table-formatter"

[tasks.format]
description = "Format with Biome"
run = "biome format --write ."

[tasks.test]
description = "Run the bats test suite"
run = "bash test-all.sh"
