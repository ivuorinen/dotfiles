# Source: catppuccin/eza, latte flavor, green accent
# https://github.com/catppuccin/eza (MIT)
# Vendored on: 2026-04-27
# Local change: accents darkened (same HSL hue and saturation) to reach
# WCAG AA 4.5:1 on base #eff1f5. Upstream green is 2.96:1 and sky is
# 2.47:1. Muted greys are left as upstream on purpose, because they mark
# low-priority fields. The mapping is in starship.light.toml.
---
colourful: true

filekinds:
  normal: {foreground: "#4c4f69"}
  directory: {foreground: "#327c21"}
  symlink: {foreground: "#1761f5"}
  pipe: {foreground: "#5c5f77"}
  block_device: {foreground: "#d61d2d"}
  char_device: {foreground: "#d61d2d"}
  socket: {foreground: "#5c5f77"}
  special: {foreground: "#8839ef"}
  executable: {foreground: "#327c21"}
  mount_point: {foreground: "#13797e"}

perms:
  user_read: {foreground: "#d20f39", is_bold: true}
  user_write: {foreground: "#996114", is_bold: true}
  user_execute_file: {foreground: "#327c21", is_bold: true}
  user_execute_other: {foreground: "#327c21", is_bold: true}
  group_read: {foreground: "#d20f39"}
  group_write: {foreground: "#996114"}
  group_execute: {foreground: "#327c21"}
  other_read: {foreground: "#d20f39"}
  other_write: {foreground: "#996114"}
  other_execute: {foreground: "#327c21"}
  special_user_file: {foreground: "#8839ef"}
  special_other: {foreground: "#8c8fa1"}
  attribute: {foreground: "#7c7f93"}

size:
  major: {foreground: "#6c6f85"}
  minor: {foreground: "#0374a1"}
  number_byte: {foreground: "#5c5f77"}
  number_kilo: {foreground: "#6c6f85"}
  number_mega: {foreground: "#1761f5"}
  number_giga: {foreground: "#8839ef"}
  number_huge: {foreground: "#8839ef"}
  unit_byte: {foreground: "#6c6f85"}
  unit_kilo: {foreground: "#0374a1"}
  unit_mega: {foreground: "#8839ef"}
  unit_giga: {foreground: "#8839ef"}
  unit_huge: {foreground: "#13797e"}

users:
  user_you: {foreground: "#4c4f69"}
  user_root: {foreground: "#d20f39"}
  user_other: {foreground: "#d61d2d"}
  group_yours: {foreground: "#6c6f85"}
  group_other: {foreground: "#7c7f93"}
  group_root: {foreground: "#d20f39"}

links:
  normal: {foreground: "#1761f5"}
  multi_link_file: {foreground: "#1761f5"}

git:
  new: {foreground: "#327c21"}
  modified: {foreground: "#996114"}
  deleted: {foreground: "#d61d2d"}
  renamed: {foreground: "#13797e"}
  typechange: {foreground: "#c71f9a"}
  ignored: {foreground: "#8c8fa1"}
  conflicted: {foreground: "#be4601"}

git_repo:
  branch_main: {foreground: "#6c6f85"}
  branch_other: {foreground: "#8839ef"}
  git_clean: {foreground: "#327c21"}
  git_dirty: {foreground: "#d61d2d"}

security_context:
  colon: {foreground: "#9ca0b0"}
  user: {foreground: "#8c8fa1"}
  role: {foreground: "#8839ef"}
  typ: {foreground: "#acb0be"}
  range: {foreground: "#8839ef"}

file_type:
  image: {foreground: "#996114"}
  video: {foreground: "#d20f39"}
  music: {foreground: "#327c21"}
  lossless: {foreground: "#13797e"}
  crypto: {foreground: "#8c8fa1"}
  document: {foreground: "#4c4f69"}
  compressed: {foreground: "#c71f9a"}
  temp: {foreground: "#d61d2d"}
  compiled: {foreground: "#187787"}
  source: {foreground: "#1761f5"}

punctuation: {foreground: "#9ca0b0"}
date: {foreground: "#996114"}
inode: {foreground: "#6c6f85"}
blocks: {foreground: "#9ca0b0"}
header: {foreground: "#4c4f69"}
octal: {foreground: "#13797e"}
flags: {foreground: "#8839ef"}

symlink_path: {foreground: "#0374a1"}
control_char: {foreground: "#187787"}
broken_symlink: {foreground: "#d20f39"}
broken_path_overlay: {foreground: "#acb0be"}
