# Palette source: https://github.com/catppuccin/catppuccin (Catppuccin Latte)
#
# Accents deviate from upstream Latte: each keeps its HSL hue and
# saturation with lightness lowered until it reaches WCAG AA (4.5:1) on
# base #eff1f5. Upstream sky is 2.47:1, which made the path unreadable.
# Upstream declines a palette change (catppuccin/catppuccin#2588). The
# same darkened set is used in the eza, dircolors, fish, gitui and fzf
# light palettes. Mauve and red already pass and are unchanged.
[palettes.active]
rosewater = "#bb4930"
flamingo = "#cb3333"
pink = "#c71f9a"
mauve = "#8839ef"
red = "#d20f39"
maroon = "#d61d2d"
peach = "#be4601"
yellow = "#996114"
green = "#327c21"
teal = "#13797e"
sky = "#0374a1"
sapphire = "#187787"
blue = "#1761f5"
lavender = "#3d5afc"
text = "#4c4f69"
subtext1 = "#5c5f77"
subtext0 = "#6c6f85"
overlay2 = "#7c7f93"
overlay1 = "#8c8fa1"
overlay0 = "#9ca0b0"
surface2 = "#acb0be"
surface1 = "#bcc0cc"
surface0 = "#ccd0da"
base = "#eff1f5"
mantle = "#e6e9ef"
crust = "#dce0e8"
