# Warm Burnout Light for the catppuccin/tmux status engine. Every @thm_* key is
# set (not just accents) so no Catppuccin colour survives the theme pass.
# Sourced by light/tmux.conf between catppuccin's options pass (which
# unsets every @thm_* when @catppuccin_reset is true) and its theme pass
# (which sets them with -o, only if unset), so these values win.
# Role map: config/theme/palettes.d/warm-burnout/light/starship.toml.
set -g @thm_bg "#f5ede0"
set -g @thm_fg "#3a3630"
set -g @thm_rosewater "#8a6600"
set -g @thm_flamingo "#8e4632"
set -g @thm_pink "#924800"
set -g @thm_mauve "#7e4060"
set -g @thm_red "#b03434"
set -g @thm_maroon "#883850"
set -g @thm_peach "#8f4418"
set -g @thm_yellow "#855700"
set -g @thm_green "#4d5c1a"
set -g @thm_teal "#286a48"
set -g @thm_sky "#285464"
set -g @thm_sapphire "#7a5a1c"
set -g @thm_blue "#2868a0"
set -g @thm_lavender "#74501c"
set -g @thm_subtext_1 "#5c5750"
set -g @thm_subtext_0 "#544c40"
set -g @thm_overlay_2 "#6a6258"
set -g @thm_overlay_1 "#8a8070"
set -g @thm_overlay_0 "#938871"
set -g @thm_surface_2 "#e0c890"
set -g @thm_surface_1 "#cfdae2"
set -g @thm_surface_0 "#ece4d6"
set -g @thm_mantle "#ede6da"
set -g @thm_crust "#ede6da"
