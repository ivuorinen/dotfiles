# Warm Burnout Dark for the catppuccin/tmux status engine. Every @thm_* key is
# set (not just accents) so no Catppuccin colour survives the theme pass.
# Sourced by dark/tmux.conf between catppuccin's options pass (which
# unsets every @thm_* when @catppuccin_reset is true) and its theme pass
# (which sets them with -o, only if unset), so these values win.
# Role map: config/theme/palettes.d/warm-burnout/light/starship.toml.
set -g @thm_bg "#1a1510"
set -g @thm_fg "#bfbdb6"
set -g @thm_rosewater "#f5c56e"
set -g @thm_flamingo "#dc9e92"
set -g @thm_pink "#ff8f40"
set -g @thm_mauve "#d4a8b8"
set -g @thm_red "#f49090"
set -g @thm_maroon "#ec9878"
set -g @thm_peach "#f29668"
set -g @thm_yellow "#ffb454"
set -g @thm_green "#b4bc78"
set -g @thm_teal "#96b898"
set -g @thm_sky "#90aec0"
set -g @thm_sapphire "#e6c08a"
set -g @thm_blue "#73b8ff"
set -g @thm_lavender "#deb074"
set -g @thm_subtext_1 "#ada69c"
set -g @thm_subtext_0 "#b4a89c"
set -g @thm_overlay_2 "#a59f96"
set -g @thm_overlay_1 "#746f67"
set -g @thm_overlay_0 "#6b6860"
set -g @thm_surface_2 "#4c4126"
set -g @thm_surface_1 "#2e3a41"
set -g @thm_surface_0 "#222018"
set -g @thm_mantle "#14120f"
set -g @thm_crust "#14120f"

set -g @catppuccin_status_battery_icon_bg "#{E:@thm_blue}"
# Date/time uses sky, matching the other derived families.
set -g @catppuccin_status_date_time_icon_bg "#{E:@thm_sky}"
set -g @_win_active_bg "#{@thm_pink}"
