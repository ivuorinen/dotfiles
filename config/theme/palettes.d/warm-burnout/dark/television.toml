# Warm Burnout Dark — derived from ../../catppuccin/dark/television.toml by the
# colour-role map in config/theme/palettes.d/warm-burnout/light/starship.toml.
# television dark palette — Warm Burnout Dark (keyword accent). The theme
# file is vendored under config/television/themes/ and linked into
# ~/.config/television/themes/; television resolves `[ui] theme` by
# filename from that directory. Appended to base.toml by the handler.
[ui]
theme = "warm-burnout-dark.toml"
