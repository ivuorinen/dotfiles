# Oasis Abyss Dark for the catppuccin/tmux status engine. Every @thm_* key is
# set (not just accents) so no Catppuccin colour survives the theme pass.
# Sourced by dark/tmux.conf between catppuccin's options pass (which
# unsets every @thm_* when @catppuccin_reset is true) and its theme pass
# (which sets them with -o, only if unset), so these values win.
# Role map: config/theme/palettes.d/oasis/light/starship.toml.
set -g @thm_bg "#000000"
set -g @thm_fg "#f5f5dc"
set -g @thm_rosewater "#e9c0a5"
set -g @thm_flamingo "#ffc0c0"
set -g @thm_pink "#7fcf78"
set -g @thm_mauve "#c695ff"
set -g @thm_red "#ff7979"
set -g @thm_maroon "#ffa0a0"
set -g @thm_peach "#f8b471"
set -g @thm_yellow "#f0e68c"
set -g @thm_green "#7fcf78"
set -g @thm_teal "#8ad3be"
set -g @thm_sky "#87ceeb"
set -g @thm_sapphire "#ff7979"
set -g @thm_blue "#81c0ff"
set -g @thm_lavender "#8d8de7"
set -g @thm_subtext_1 "#a3abb8"
set -g @thm_subtext_0 "#7a7662"
set -g @thm_overlay_2 "#607d85"
set -g @thm_overlay_1 "#7b786d"
set -g @thm_overlay_0 "#605c4d"
set -g @thm_surface_2 "#2b4a46"
set -g @thm_surface_1 "#1c1c1c"
set -g @thm_surface_0 "#141414"
set -g @thm_mantle "#080808"
set -g @thm_crust "#121212"
