# Oasis Abyss Light 3 for the catppuccin/tmux status engine. Every @thm_* key is
# set (not just accents) so no Catppuccin colour survives the theme pass.
# Sourced by light/tmux.conf between catppuccin's options pass (which
# unsets every @thm_* when @catppuccin_reset is true) and its theme pass
# (which sets them with -o, only if unset), so these values win.
# Role map: config/theme/palettes.d/oasis/light/starship.toml.
set -g @thm_bg "#d8d8d8"
set -g @thm_fg "#181811"
set -g @thm_rosewater "#5b3b28"
set -g @thm_flamingo "#ba141a"
set -g @thm_pink "#2e6b28"
set -g @thm_mauve "#691fbe"
set -g @thm_red "#9e1010"
set -g @thm_maroon "#870f13"
set -g @thm_peach "#744211"
set -g @thm_yellow "#554f1c"
set -g @thm_green "#31572e"
set -g @thm_teal "#2f564a"
set -g @thm_sky "#1e546a"
set -g @thm_sapphire "#750202"
set -g @thm_blue "#11508d"
set -g @thm_lavender "#5049c1"
set -g @thm_subtext_1 "#3d4047"
set -g @thm_subtext_0 "#615e54"
set -g @thm_overlay_2 "#647276"
set -g @thm_overlay_1 "#7c7a74"
set -g @thm_overlay_0 "#615f57"
set -g @thm_surface_2 "#97cebe"
set -g @thm_surface_1 "#b9b9b9"
set -g @thm_surface_0 "#cdcdcd"
set -g @thm_mantle "#d4d4d4"
set -g @thm_crust "#d0d0d0"
