# Catppuccin Latte accents darkened (same HSL hue and saturation) to reach
# WCAG AA 4.5:1 on base #eff1f5; mapping in starship.light.toml.
#
# Sourced by tmux.light.conf between catppuccin's options pass (which
# unsets every @thm_* when @catppuccin_reset is true) and its theme pass
# (which sets them with -o, only if unset), so these values win. Setting
# them before catppuccin.tmux runs does not work: the reset wipes them.
set -g @thm_rosewater "#bb4930"
set -g @thm_flamingo "#cb3333"
set -g @thm_pink "#c71f9a"
set -g @thm_maroon "#d61d2d"
set -g @thm_peach "#be4601"
set -g @thm_yellow "#996114"
set -g @thm_green "#327c21"
set -g @thm_teal "#13797e"
set -g @thm_sky "#0374a1"
set -g @thm_sapphire "#187787"
set -g @thm_blue "#1761f5"
set -g @thm_lavender "#3d5afc"
