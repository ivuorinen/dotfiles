# Kanagawa Wave for the catppuccin/tmux status engine. Every @thm_* key is
# set (not just accents) so no Catppuccin colour survives the theme pass.
# Sourced by dark/tmux.conf between catppuccin's options pass (which
# unsets every @thm_* when @catppuccin_reset is true) and its theme pass
# (which sets them with -o, only if unset), so these values win.
# Role map: docs/plans/2026-09-30-kanagawa-theme-families.md.
set -g @thm_bg "#1f1f28"
set -g @thm_fg "#dcd7ba"
set -g @thm_rosewater "#c8c093"
set -g @thm_flamingo "#e46876"
set -g @thm_pink "#d27e99"
set -g @thm_mauve "#957fb8"
set -g @thm_red "#e46876"
set -g @thm_maroon "#ff5d62"
set -g @thm_peach "#ffa066"
set -g @thm_yellow "#e6c384"
set -g @thm_green "#98bb6c"
set -g @thm_teal "#7aa89f"
set -g @thm_sky "#7fb4ca"
set -g @thm_sapphire "#a3d4d5"
set -g @thm_blue "#7e9cd8"
set -g @thm_lavender "#9cabca"
set -g @thm_subtext_1 "#c8c093"
set -g @thm_subtext_0 "#a6a69c"
set -g @thm_overlay_2 "#938aa9"
set -g @thm_overlay_1 "#717c7c"
set -g @thm_overlay_0 "#727169"
set -g @thm_surface_2 "#54546d"
set -g @thm_surface_1 "#363646"
set -g @thm_surface_0 "#2a2a37"
set -g @thm_mantle "#181820"
set -g @thm_crust "#16161d"
