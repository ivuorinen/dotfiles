# Kanagawa Lotus AA for the catppuccin/tmux status engine. Every @thm_* key is
# set (not just accents) so no Catppuccin colour survives the theme pass.
# Sourced by light/tmux.conf between catppuccin's options pass (which
# unsets every @thm_* when @catppuccin_reset is true) and its theme pass
# (which sets them with -o, only if unset), so these values win.
# Role map: docs/plans/2026-09-30-kanagawa-theme-families.md.
set -g @thm_bg "#f2ecbc"
set -g @thm_fg "#545464"
set -g @thm_rosewater "#9a5b00"
set -g @thm_flamingo "#c92c30"
set -g @thm_pink "#a54c6b"
set -g @thm_mauve "#624c83"
set -g @thm_red "#c0374a"
set -g @thm_maroon "#c92c30"
set -g @thm_peach "#a15600"
set -g @thm_yellow "#716b3c"
set -g @thm_green "#5b7040"
set -g @thm_teal "#51706b"
set -g @thm_sky "#3e7082"
set -g @thm_sapphire "#536e7b"
set -g @thm_blue "#4d699b"
set -g @thm_lavender "#5d57a3"
set -g @thm_subtext_1 "#43436c"
set -g @thm_subtext_0 "#6d6a5e"
set -g @thm_overlay_2 "#766b90"
set -g @thm_overlay_1 "#716e61"
set -g @thm_overlay_0 "#88877e"
set -g @thm_surface_2 "#a09cac"
set -g @thm_surface_1 "#d5cea3"
set -g @thm_surface_0 "#e7dba0"
set -g @thm_mantle "#e5ddb0"
set -g @thm_crust "#dcd5ac"
