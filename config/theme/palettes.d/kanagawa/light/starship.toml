# Kanagawa Lotus AA — derived from ../../catppuccin/light/starship.toml by the
# colour-role map in docs/plans/2026-09-30-kanagawa-theme-families.md.
# Starship prompt — port of config/omp/own.toml (the previous oh-my-posh
# theme), Kanagawa Lotus (light).
#
# Mirror of dark/starship.toml with the palette swapped. The dark/light
# variants are kept as separate complete files so the theme orchestrator
# (config/theme/handlers.d/starship)
# can switch them via a symlink at ~/.config/starship.toml. Starship reads
# its config on every prompt subprocess invocation, so the swap takes
# effect on the next prompt with no shell-side reload.
#
# MAINTAINER NOTE: any non-palette change made here MUST also be applied
# to dark/starship.toml. The two files are intentionally identical except
# for `palette = "..."` and the [palettes.*] block.
#
# Layout: line 1 = OS icon · user@host (SSH only) · path
#                 · git · node · dotnet · go · php · ruby · python
#         line 2 = ➜ (green on success, red on non-zero exit)
# Transient prompt collapses prior prompts to just `➜ ` (wired by
# `enable_transience` in config/fish/config.fish and base/zshrc).
#
# Username is peach, hostname is lavender (your "differentiated colours"
# request); both still hidden outside SSH per starship defaults.
#
# Palette source: https://github.com/rebelot/kanagawa.nvim (Kanagawa Lotus)
#
# Accents deviate from upstream Lotus: each keeps its HSL hue and
# saturation with lightness lowered until it reaches WCAG AA (4.5:1) on
# base #f2ecbc (overlay0: 3:1). Upstream rosewater-slot #e98a00 was 2.16:1.
# The same darkened set is used in every Kanagawa light palette and in
# nvim, vim, wezterm, fish, bat and COSMIC; tests/theme-contrast.bats
# recomputes the ratios. Upstream -> AA:
#   red       #c84053 -> #c0374a
#   maroon    #d7474b -> #c92c30
#   peach     #cc6d00 -> #a15600
#   yellow    #77713f -> #716b3c
#   green     #6f894e -> #5b7040
#   teal      #597b75 -> #51706b
#   sky       #4e8ca2 -> #3e7082
#   sapphire  #5a7785 -> #536e7b
#   pink      #b35b79 -> #a54c6b
#   rosewater #e98a00 -> #9a5b00
#   subtext0  #716e61 -> #6d6a5e
#   overlay0  #8a8980 -> #88877e
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 2000

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$dotnet\
$golang\
$php\
$ruby\
$python\
$line_break\
$character"""

palette = "kanagawa_lotus"

[palettes.kanagawa_lotus]
rosewater = "#9a5b00"
flamingo = "#c92c30"
pink = "#a54c6b"
mauve = "#624c83"
red = "#c0374a"
maroon = "#c92c30"
peach = "#a15600"
yellow = "#716b3c"
green = "#5b7040"
teal = "#51706b"
sky = "#3e7082"
sapphire = "#536e7b"
blue = "#4d699b"
lavender = "#5d57a3"
text = "#545464"
subtext1 = "#43436c"
subtext0 = "#6d6a5e"
overlay2 = "#766b90"
overlay1 = "#716e61"
overlay0 = "#88877e"
surface2 = "#a09cac"
surface1 = "#d5cea3"
surface0 = "#e7dba0"
base = "#f2ecbc"
mantle = "#e5ddb0"
crust = "#dcd5ac"

[os]
disabled = false
style = "sky"
format = "[$symbol]($style) "

# Nerd Font glyphs via \uXXXX escapes — the Write/Edit pipeline strips
# bare BMP Private-Use-Area characters (U+E000-U+F8FF), so the literal
# glyphs would arrive as empty strings. Escapes survive verbatim and the
# TOML parser converts them at load time.
[os.symbols]
Macos = "\uF179"
Linux = "\uF17C"
Ubuntu = "\uF31B"
Debian = "\uF306"
Fedora = "\uF30A"
Arch = "\uF303"
Windows = "\uF17A"
Alpine = "\uF300"
NixOS = "\uF313"
Raspbian = "\uF315"
Manjaro = "\uF312"
Pop = "\uF32A"

# Username — only shown over SSH (or as root) per starship defaults.
# Differentiated from hostname via peach. The "@" separator lives in
# the hostname format below so it only appears when hostname renders
# (avoids a dangling "root@" when running as root locally without SSH).
[username]
style_user = "peach"
style_root = "red bold"
format = "[$user]($style)"

# Hostname — SSH-only by default; lavender so it contrasts with peach user.
# trim_at = "." matches tide_context_hostname_parts = 1 (drop domain).
# The "@" separator is part of this format (subtext0) so it only renders
# when hostname renders.
[hostname]
ssh_only = true
trim_at = "."
style = "lavender"
format = "[@](subtext0)[$hostname]($style) "

# Path — sky (Catppuccin's cyan) matches omp's cyan path colour.
[directory]
style = "sky"
truncation_length = 3
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " "
read_only_style = "red"
fish_style_pwd_dir_length = 1

# Git — lightGreen in omp = green here; branch and status share the colour.
[git_branch]
symbol = "\uE725 "
style = "green"
format = "[$symbol$branch]($style) "

[git_status]
style = "green"
format = "[$all_status$ahead_behind]($style) "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
conflicted = "=${count}"
deleted = "✘${count}"
modified = "!${count}"
renamed = "»${count}"
staged = "+${count}"
stashed = "≡${count}"
untracked = "?${count}"
up_to_date = ""

[git_state]
style = "yellow"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

# Languages — colours match omp foregrounds, mapped to Catppuccin equivalents.

[nodejs]
symbol = "\uE718 "
style = "green"
version_format = "${major}.${minor}"
format = "[$symbol$version]($style) "

[dotnet]
symbol = "\uE77F "
style = "mauve"
version_format = "${major}"
format = "[$symbol$version]($style) "

[golang]
symbol = "\uE626 "
style = "teal"
version_format = "${major}.${minor}.${patch}"
format = "[$symbol$version]($style) "

[php]
symbol = "\uE73D "
style = "lavender"
format = "[$symbol$version]($style) "

[ruby]
symbol = "\uE739 "
style = "red"
format = "[$symbol$version]($style) "

[python]
symbol = "\uE73C "
style = "yellow"
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

# Status arrow on its own line. Green on success, red on non-zero exit.
[character]
success_symbol = "[➜](green)"
error_symbol = "[➜](red)"
vimcmd_symbol = "[❮](green)"
