# Kanagawa Lotus AA — derived from ../../catppuccin/light/starship.toml by the
# colour-role map in docs/plans/2026-09-30-kanagawa-theme-families.md.
# Palette source: https://github.com/rebelot/kanagawa.nvim (Kanagawa Lotus)
#
# Accents deviate from upstream Lotus: each keeps its HSL hue and
# saturation with lightness lowered until it reaches WCAG AA (4.5:1) on
# base #f2ecbc (overlay0: 3:1). Upstream rosewater-slot #e98a00 was 2.16:1.
# The same darkened set is used in every Kanagawa light palette and in
# nvim, vim, wezterm, fish, bat and COSMIC; tests/theme-contrast.bats
# recomputes the ratios. Upstream -> AA:
#   red       #c84053 -> #c0374a
#   maroon    #d7474b -> #c92c30
#   peach     #cc6d00 -> #a15600
#   yellow    #77713f -> #716b3c
#   green     #6f894e -> #5b7040
#   teal      #597b75 -> #51706b
#   sky       #4e8ca2 -> #3e7082
#   sapphire  #5a7785 -> #536e7b
#   pink      #b35b79 -> #a54c6b
#   rosewater #e98a00 -> #9a5b00
#   subtext0  #716e61 -> #6d6a5e
#   overlay0  #8a8980 -> #88877e
[palettes.active]
rosewater = "#9a5b00"
flamingo = "#c92c30"
pink = "#a54c6b"
mauve = "#624c83"
red = "#c0374a"
maroon = "#c92c30"
