# Kanagawa Lotus AA — derived from ../../catppuccin/light/tmux.conf by the
# colour-role map in docs/plans/2026-09-30-kanagawa-theme-families.md.
set -g @catppuccin_flavor "latte"
set -g @catppuccin_reset "true"

# Unset per-module colors cached from prior theme (reset doesn't cover these).
# The -U flag (unset at parent scope) requires tmux >= 3.4. On older tmux the
# parser silently ignores -Ugq, leaving stale per-module colors after a flip.
set -Ugq @catppuccin_status_directory_text_fg
set -Ugq @catppuccin_status_directory_icon_fg
set -Ugq @catppuccin_status_session_text_fg
set -Ugq @catppuccin_status_session_icon_fg
set -Ugq @catppuccin_status_application_text_fg
set -Ugq @catppuccin_status_application_icon_fg
set -Ugq @catppuccin_status_date_time_text_fg
set -Ugq @catppuccin_status_date_time_icon_fg
set -Ugq @catppuccin_status_battery_text_fg
set -Ugq @catppuccin_status_battery_icon_fg

# Pre-set icon_bg before catppuccin.tmux runs; status_module.conf skips its default when non-empty.
# Lazy #{E:@thm_*} refs: catppuccin's defaults are expanded once (set -ogqF)
# and never refreshed, so a flip kept the first family's hex.
set -g @catppuccin_status_application_icon_bg "#{E:@thm_maroon}"
set -g @catppuccin_status_battery_icon_bg "#{E:@thm_blue}"
set -g @catppuccin_status_date_time_icon_bg "#{E:@thm_sapphire}"

# Active window pill, read by config/tmux/window-blocks.conf.
set -g @_win_active_bg "#{@thm_mauve}"

# Load catppuccin, then immediately re-assert our window blocks (rounded + zoom
# indicator) so catppuccin's basic-style rebuild doesn't win. Chained in one
# shell command so ordering is guaranteed regardless of run-shell scheduling.
# catppuccin.tmux is only `source options; source catppuccin_tmux.conf`; the
# two passes are run here directly so light/tmux.thm.conf (Kanagawa colours)
# lands after the options pass resets @thm_* and before the theme pass sets
# the upstream Latte values with -o (only if unset).
run-shell "P=$HOME/.local/share/tmux/plugins/tmux; tmux source-file \"\$P/catppuccin_options_tmux.conf\" && tmux source-file \"\${DOTFILES:-\$HOME/.dotfiles}/config/theme/palettes.d/kanagawa/light/tmux.thm.conf\" && tmux source-file \"\$P/catppuccin_tmux.conf\" && tmux source-file $HOME/.config/tmux/window-blocks.conf"
