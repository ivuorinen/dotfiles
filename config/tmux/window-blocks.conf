# Window blocks — owned here, not by catppuccin.
#
# The theme palettes (config/theme/palettes.d/tmux.*.conf) re-run catppuccin
# with @catppuccin_reset=true on every load and theme flip, which resets
# @catppuccin_window_status_style back to "basic". So a rounded, zoom-aware
# window list cannot be expressed through catppuccin's window options — they get
# rebuilt away. Each palette sources THIS file right after catppuccin instead,
# so these formats win. Colours are lazy #{@thm_*} refs, so they still adapt on
# dark/light flips without a rebuild.

# Glyphs populated from raw UTF-8 bytes so they cannot be lost in editing:
#   @_cap_l  U+E0B6 left rounded cap   (EE 82 B6) — same cap catppuccin uses
#   @_cap_r  U+E0B4 right rounded cap  (EE 82 B4)
#   @_zoom   U+F0293 fullscreen glyph  (F3 B0 8A 93)
# Resolved lazily as #{@_cap_l} etc. at draw time, after this run-shell fires.
# Octal escapes, not \xHH: run-shell uses /bin/sh, and dash's printf passes
# \xHH through as literal text — the pills then render as "\xee\x82\xb6".
run-shell 'tmux set -g @_cap_l "$(printf "\356\202\266")"; tmux set -g @_cap_r "$(printf "\356\202\264")"; tmux set -g @_zoom "$(printf "\363\260\212\223")"'

# Active-window block colour: peach while its pane is zoomed, else the
# palette's @_win_active_bg (mauve, or the family accent), falling back to mauve.
# #{E:@_win_zoom_bg} is evaluated per-window at draw time, so the flag is live.
set -g @_win_zoom_bg "#{?window_zoomed_flag,#{@thm_peach},#{?@_win_active_bg,#{E:@_win_active_bg},#{@thm_mauve}}}"

# Inactive-window pill colour: yellow on a bell, lavender on activity or
# silence (catppuccin's alert colours), else the plain surface pill.
set -g @_win_alert_bg "#{?window_bell_flag,#{@thm_yellow},#{?#{||:#{window_activity_flag},#{window_silence_flag}},#{@thm_lavender},#{@thm_surface_1}}}"
set -g @_win_alert_fg "#{?#{||:#{window_bell_flag},#{||:#{window_activity_flag},#{window_silence_flag}}},#{@thm_crust},#{@thm_fg}}"

# catppuccin sets window-status-{activity,bell}-style to a solid bg. tmux uses
# them as the base style of the whole alerted entry, and every bg=default in
# the formats resolves to that base, so the caps and name sat on a block.
# "default" makes status-format skip them; the pill carries the alert instead.
set -g window-status-activity-style default
set -g window-status-bell-style default

set -g window-status-separator ""

# Inactive window: rounded pill with the index, coloured by any alert, then a
# dim name.
set -g window-status-format "#[fg=#{E:@_win_alert_bg},bg=default]#{@_cap_l}#[fg=#{E:@_win_alert_fg},bg=#{E:@_win_alert_bg}] #I #[fg=#{E:@_win_alert_bg},bg=default]#{@_cap_r}#[fg=#{@thm_overlay_1},bg=default] #W "

# Active window: rounded pill that turns peach and swaps the index for the zoom
# glyph while the pane is zoomed, then the window name in bold.
# tmux 3.8 defaults the base style to "underscore", which the format's colour
# directives do not clear; the pill sets every colour itself.
set -g window-status-current-style default
set -g window-status-current-format "#[fg=#{E:@_win_zoom_bg},bg=default]#{@_cap_l}#[fg=#{@thm_crust},bg=#{E:@_win_zoom_bg}] #{?window_zoomed_flag,#{@_zoom},#I} #[fg=#{E:@_win_zoom_bg},bg=default]#{@_cap_r}#[fg=#{@thm_fg},bg=default,bold] #W "
