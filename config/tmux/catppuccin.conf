# config/tmux/catppuccin.conf — catppuccin/tmux status-engine settings
# shared by every theme family. config/theme/tmux-palette sources it first,
# then the plugin's options pass, the family's tmux.thm.conf (its @thm_*
# colours, and any accent it overrides below), the plugin's theme pass and
# config/tmux/window-blocks.conf.
set -g @catppuccin_reset "true"

# Unset per-module colors cached from prior theme (reset doesn't cover these).
# The -U flag (unset at parent scope) requires tmux >= 3.4. On older tmux the
# parser silently ignores -Ugq, leaving stale per-module colors after a flip.
set -Ugq @catppuccin_status_directory_text_fg
set -Ugq @catppuccin_status_directory_icon_fg
set -Ugq @catppuccin_status_session_text_fg
set -Ugq @catppuccin_status_session_icon_fg
set -Ugq @catppuccin_status_application_text_fg
set -Ugq @catppuccin_status_application_icon_fg
set -Ugq @catppuccin_status_date_time_text_fg
set -Ugq @catppuccin_status_date_time_icon_fg
set -Ugq @catppuccin_status_battery_text_fg
set -Ugq @catppuccin_status_battery_icon_fg

# Pre-set icon_bg before the plugin runs; status_module.conf skips its default when non-empty.
# Lazy #{E:@thm_*} refs: catppuccin's defaults are expanded once (set -ogqF)
# and never refreshed, so a flip kept the first family's hex.
set -g @catppuccin_status_application_icon_bg "#{E:@thm_maroon}"
set -g @catppuccin_status_date_time_icon_bg "#{E:@thm_sapphire}"

# Active window pill, read by config/tmux/window-blocks.conf.
set -g @_win_active_bg "#{@thm_mauve}"
