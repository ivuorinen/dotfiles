#:schema https://mise.jdx.dev/schema/mise.json
[settings]
# Use uvx (from uv) instead of requiring pipx to be installed separately
pipx.uvx = true
# Python libraries to install into every python mise installs. Kept in this
# directory rather than the default ~/.default-python-packages so it lives
# with the rest of the mise config and is version-controlled.
python.default_packages_file = "~/.config/mise/default-python-packages"
trusted_config_paths = [
  "~/Code/ivuorinen",
  "~/Code/s",
  "~/Code/masf",
  "~/Code/9b11",
  "~/Code/eslefi",
]
# Respect .nvmrc, .python-version, .ruby-version, etc. in other projects.
# This repo uses .mise.toml at the repo root for pinned versions.
idiomatic_version_file = true
idiomatic_version_file_enable_tools = [
  "node",
  "python",
  "ruby",
  "go",
  "java",
  "terraform",
  "yarn",
  "bun",
  "deno",
  "dotnet",
]

# Generate mise.lock for reproducible installs
lockfile = true

# Save disk space — don't keep downloaded archives or failed installs
always_keep_download = false
always_keep_install = false
experimental = true
auto_update = true

[tools]
# Tools are grouped by function below, not by backend. Prefixed keys
# (npm:, dotnet:, github:, aqua:) select a specific mise backend;
# unprefixed keys resolve through the default registry (aqua binaries).
# npm:/dotnet: tools live here rather than in package.json so hook
# scripts and interactive shells get them on PATH without depending on
# yarn's node_modules/.bin shim. package.json devDependencies stay
# reserved for build-time TypeScript tooling pinned per-project.

# Language runtimes & build toolchains
node = "lts"
bun = "1.4.0"
python = "3.14"
go = "1.27.0"
rust = "1.98.0"
uv = "0.12.7"
cmake = "4.4.3"

# Shell, prompt & terminal sessions
starship = "1.26.0"
tmux = "3.7b"
usage = "6.5.0"
"github:joshmedeski/sesh" = "2.28.0"
"github:jrmoulton/tmux-sessionizer" = "0.6.1"

# File navigation, search & viewing
fd = "10.5.0"
ripgrep = "15.2.0"
eza = "0.23.5"
zoxide = "0.10.0"
fzf = "0.74.3"
"github:alexpasmantier/television" = "0.15.9"
yazi = "26.8.15"
bat = "0.26.1"
glow = "3.0.0"

# Text & document processing
jq = "1.8.2"
yq = "4.53.6"
choose = "1.3.7"
"github:jgm/pandoc" = "3.11"

# Git & version control
github-cli = "2.98.0"
gitui = "0.28.1"
lazygit = "0.64.1"
delta = "0.19.2"
difftastic = "0.70.0"
"github:dotzero/git-profile" = "1.9.0"             # ships macOS-all universal binary
"github:max-sixty/worktrunk" = "0.75.0"
"npm:github-release-notes" = "0.17.3"
"github:shhac/git-hunk" = "0.18.1"
"github:modem-dev/hunk" = "0.20.1"
"github:ivuorinen/gh-history" = "2026.03.0"

# Editors & language servers
neovim = "0.12.5"
tree-sitter = "0.26.13"
"npm:neovim" = "5.4.0"                      # Node.js client for Neovim's RPC API (required by plugins)
"npm:fish-lsp" = "1.1.4"

# Task runners & caching
just = "1.58.0"
"github:dimo414/bkt" = "0.8.2"

# Linters & formatters
editorconfig-checker = "3.11.2"
biome = "2.5.10"
"npm:prettier" = "3.9.6"
"npm:markdownlint-cli" = "0.49.1"
"npm:markdown-table-formatter" = "1.7.0"
"npm:v8r" = "6.1.0"
yamllint = "1.38.0"
yamlfmt = "0.21.0"
ruff = "0.16.5"
stylua = "2.5.2"
taplo = "0.10.0"
shellcheck = "0.11.0"
shfmt = "3.13.1"
actionlint = "1.7.12"
"aqua:mpalmer/action-validator" = "0.9.0"
hadolint = "2.15.1"
"dotnet:csharpier" = "1.3.0"

# Go linters & formatters. Used in other repos, not this one — they live here
# because dotfiles provisions the machine, not just this checkout.
#
# gofumpt/golines/revive are pinned to the github backend for the same reason
# as grype and syft below. Measured with `mise install --force`:
#
#   gofumpt  aqua: checksum   github: checksum + attestations
#   golines  aqua: checksum   github: checksum + attestations + SLSA provenance
#   revive   aqua: checksum   github: checksum + attestations + SLSA provenance
#
# gocyclo is the odd one: it publishes no release assets at all, so neither the
# registry nor the github backend can see it — the go backend is the only route,
# and it builds from source against the go entry pinned above.
"github:mvdan/gofumpt" = "0.11.0"
"github:segmentio/golines" = "0.13.0"
"github:mgechev/revive" = "1.16.0"
"go:github.com/fzipp/gocyclo/cmd/gocyclo" = "0.6.0"
golangci-lint = "2.13.2"

# Security & supply chain
age = "1.3.2"
gopass = "1.16.1"                          # pass-compatible password manager (gopasspw/gopass)
cosign = "3.1.3"
gitleaks = "8.30.1"
trufflehog = "3.97.1"
# grype and syft are pinned to the github backend rather than left bare, because
# it is the only backend that verifies them beyond a checksum. Measured, not
# assumed — `mise install --force` prints what it actually verified:
#
#   grype   aqua: checksum        github: checksum + attestations verified
#   syft    aqua: checksum        github: checksum + attestations verified
#
# The rest of the security section stays bare on purpose. aqua already verifies
# attestations for age/zizmor/pinact and Cosign signatures for trivy and cosign,
# so moving those would gain nothing and cosign would actively lose its
# signature check. A bare entry also lets the registry absorb an upstream org
# rename — which is exactly how gitui moved from extrawurst to gitui-org
# without a config change.
"github:anchore/grype" = "0.118.0"
trivy = "0.74.0"
"github:anchore/syft" = "1.51.1"
semgrep = "1.174.0"
opengrep = "1.29.0"
osv-scanner = "2.5.1"
scorecard = "5.5.0"
# Python SAST. Not in mise's registry, so it comes through the pipx backend.
# The [toml] extra is required: without it bandit cannot read its config out
# of pyproject.toml and silently falls back to defaults.
"pipx:bandit[toml]" = "1.9.4"
checkov = "3.3.15"
snyk = "1.1306.4"
pinact = "4.1.1"
zizmor = "1.29.0"
"github:Legit-Labs/legitify" = "1.0.11"
"github:projectdiscovery/katana" = "1.7.0"
# Go vulnerability scanner. Neither the registry nor the github backend knows
# golang/vuln, so the go backend is the only route — same case as gocyclo above.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"

# Build, test & CI
bats = "1.14.0"
act = "0.2.89"
prek = "0.4.14"
"npm:corepack" = "0.35.0"
"dotnet:coverlet.console" = "10.0.1"
# Go HTML templating codegen. Not in mise's registry, so it comes through the
# github backend — which also gets attestations + SLSA provenance.
"github:a-h/templ" = "0.3.1020"

# System monitoring & misc utilities
bottom = "0.14.9"
cheat = "5.1.0"
"github:binwiederhier/ntfy" = "2.28.0"
"github:wakatime/wakatime-cli" = "2.24.4"
"github:o2sh/onefetch" = "2.27.1"
"github:exercism/cli" = "3.5.8"
"npm:ccusage" = "20.0.20"
"github:ZenNotes/zennotes" = "2.36.0"

# Homebrew formulae installed by mise's experimental brew bootstrap, without
# requiring the `brew` CLI. mise pours these into the canonical Homebrew prefix
# (/opt/homebrew), so binary paths are identical to a native `brew install`.
# Applied by `mise bootstrap packages apply` (wired into `dfm install mise`).
#
# Only homebrew/core, on-request LEAVES live here — mise resolves each formula's
# dependency closure automatically, so transitive deps are intentionally omitted.
# Kept on native brew (config/homebrew/Brewfile) on purpose: imagemagick,
# ffmpeg, coreutils (GNU, not uutils), and all casks — 1password-cli included,
# since it is a cask and not a formula.
# PHP is managed by phpenv.fish (homebrew provider), not here.
# Anything already in [tools] above (e.g. jq) is not re-introduced.
#
# Every entry is "latest" by necessity, not by omission: Homebrew installs only
# the current revision of a plain formula, so there is no version to pin here.
#
# Why these stay on brew rather than becoming [tools] entries — all 49 were
# checked and none can move:
#
#   * 48 of 49 have no mise registry entry. The one that does,
#     dependency-check, is a Java application: mise installs it, but it dies
#     with "JAVA_HOME is not defined correctly" because brew resolves its JRE
#     dependency and mise does not.
#   * 26 are GitHub-hosted, but only 5 publish prebuilt binaries rather than
#     source tarballs — the rest (chafa, htop, irssi, flock, …) ship a .tar.gz
#     that the github backend cannot use, and git-extras, kcov, testssl.sh,
#     luarocks and tree publish no release assets at all.
#   * Of those 5: Mole has no Linux asset and fails outright,
#     terminal-notifier unpacks a macOS .app that is inert on Linux, and
#     gpg-tui installs but cannot run — "libgpgme.so.11: cannot open shared
#     object file", again a dependency brew supplies and mise does not.
#
#   * fish installs and runs, and was moved here briefly before being put
#     back: its release tarball contains the `fish` binary ALONE. No
#     fish_indent. This repo gates on `fish_indent --check` in both
#     .pre-commit-config.yaml and the Tests workflow, so pinning fish at 4.8.1
#     would have left the formatter floating at whatever apt or brew supplies
#     (3.7.0 here) — a formatter decoupled from its shell, across a major
#     version, guarding 38 tracked files.
#
# The pattern is the point: brew resolves a dependency closure, mise installs a
# single self-contained artifact. A formula that needs system libraries, a
# runtime, or sibling binaries belongs here, not in [tools]. There are no
# platform conditionals in this file either, so a macOS-only tool moved to
# [tools] would break `mise install` on Linux.
#
# fswatch is the one clean technical candidate — prebuilt Linux and macOS
# binaries, no dependencies — but nothing in this repo references it at all, so
# deleting it beats moving it.
[bootstrap.packages]
"brew:autoconf-archive" = "latest"
"brew:autogen" = "latest"
"brew:automake" = "latest"
"brew:bash" = "latest"
"brew:bison" = "latest"
"brew:bzip2" = "latest"
"brew:certifi" = "latest"
"brew:chafa" = "latest"
"brew:cryptography" = "latest"
"brew:dependency-check" = "latest"
"brew:dnsmasq" = "latest"
"brew:enchant" = "latest"
"brew:exiftool" = "latest"
"brew:figlet" = "latest"
"brew:fish" = "latest"
"brew:flock" = "latest"
"brew:fswatch" = "latest"
"brew:ghostscript" = "latest"
"brew:git" = "latest"
"brew:git-extras" = "latest"
"brew:gnu-sed" = "latest"
"brew:gpg-tui" = "latest"
"brew:graphviz" = "latest"
"brew:grep" = "latest"
"brew:gzip" = "latest"
"brew:htop" = "latest"
"brew:hwloc" = "latest"
"brew:irssi" = "latest"
"brew:jpeg" = "latest"
"brew:json-c" = "latest"
"brew:kcov" = "latest"
"brew:libedit" = "latest"
"brew:libressl" = "latest"
"brew:libuv" = "latest"
"brew:libvoikko" = "latest"
"brew:libxml2" = "latest"
"brew:libyaml" = "latest"
"brew:luarocks" = "latest"
"brew:lzip" = "latest"
"brew:mole" = "latest"
"brew:moreutils" = "latest"
"brew:ossp-uuid" = "latest"
"brew:re2c" = "latest"
"brew:terminal-notifier" = "latest"
"brew:testssl" = "latest"
"brew:tree" = "latest"
"brew:watch" = "latest"
"brew:wget" = "latest"
"brew:zlib" = "latest"
