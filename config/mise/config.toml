#:schema https://mise.jdx.dev/schema/mise.json
# Releases before 2026.11.0 read a bare `go X.Y` line in go.mod as a version
# request. Warn on them rather than stop: a hard floor in the global config
# would break every shell on a host that has not upgraded yet.
min_version = { soft = "2026.11.0" }
[settings]
# Use uvx (from uv) instead of requiring pipx to be installed separately
pypi.uvx = true
trusted_config_paths = [
  "~/Code/ivuorinen",
  "~/Code/s",
  "~/Code/masf",
  "~/Code/9b11",
  "~/Code/eslefi",
]
# Respect .nvmrc, .python-version, .ruby-version, etc. in other projects.
# This repo uses .mise/config.toml for pinned versions.
idiomatic_version_file = true
idiomatic_version_file_enable_tools = [
  "node",
  "python",
  "ruby",
  "go",
  "java",
  "terraform",
  "yarn",
  "bun",
  "deno",
  "dotnet",
]
# PHP versions belong to phpenv.fish (config/fish/fish_plugins), which reads
# .php-version, .tool-versions and composer.json itself. Without this, a `php`
# line in a project's .tool-versions would have mise build PHP from source
# (auto_install below) and manage PATH beside phpenv.
disable_tools = ["php"]

# Generate mise.lock for reproducible installs. This creates project
# lockfiles only: the global one (config/mise/mise.lock, gitignored) comes
# from `mise lock --global`, which `dfm install mise` runs when it is absent.
lockfile = true

# Save disk space — don't keep downloaded archives or failed installs
always_keep_install = false
experimental = true
auto_update = true
auto_install = true
# The default 24h minimum_release_age is passed to uv as a rolling
# exclude-newer, which mise hashes into the pypi install path — so every run
# lands in a new directory and auto_install reinstalls pypi tools forever
# (still present in mise 2026.9.10). Drop this once mise fixes it.
minimum_release_age_excludes = ["pypi:*"]

[tools]
# Tools are grouped by function below, not by backend. Within a group they
# sort by tool name, ignoring the backend prefix and the repo owner, so
# "github:joshmedeski/sesh" files under s. Prefixed keys (npm:, pipx:, go:,
# cargo:, github:, aqua:, …) select a specific mise backend; unprefixed keys
# resolve through the default registry (mostly aqua binaries).
# npm:/dotnet: tools live here rather than in a package.json so hook
# scripts and interactive shells get them on PATH without depending on a
# package manager's node_modules/.bin shim. A project's own package.json
# devDependencies stay reserved for build-time tooling pinned per-project.

# Language runtimes & build toolchains
bun = "1.4.5"
cargo-binstall = "latest"
cmake = "4.4.5"
"npm:corepack" = "0.36.0"
go = "1.27.4"
node = "lts"
python = "3.14"
rust = "1.99.1"
uv = "0.13.7"

# Shell, prompt & terminal sessions
"github:joshmedeski/sesh" = "2.34.0"
starship = "1.27.0"
tmux = "3.7c"
"github:jrmoulton/tmux-sessionizer" = "0.6.1"
usage = "7.3.0"

# File navigation, search & viewing
bat = "0.26.1"
"cargo:eza" = "0.23.5"
fd = "10.5.2"
fzf = "0.74.5"
glow = "3.0.0"
ripgrep = "15.2.0"
"github:alexpasmantier/television" = "0.15.9"
zoxide = "0.10.0"

# Text & document processing
adr-tools = "3.0.0"
choose = "1.3.7"
# The registry resolves this to conda:imagemagick, a build that carries its own
# delegates (jpeg, png, webp, heic, rsvg, …) on Linux and macOS alike, so both
# get `magick` (x-thumbgen) without Homebrew or a downloaded binary.
imagemagick = "7.1.2_31"
jq = "1.8.2"
"github:jgm/pandoc" = "3.13"
poppler = "latest"
# No odfpy (ODS): it ships no wheel, and mise's dependency graph is
# wheel-only, so it would fail the graph and warn on every install.
"pypi:visidata" = { version = "latest", with = [
  "openpyxl",     # XLSX
  "xlrd",         # XLS
  "pyarrow",      # Parquet, Arrow
  "duckdb",       # DuckDB
  "lxml",         # XML, HTML
  "PyYAML",       # YAML
  "h5py",         # HDF5
  "pandas",       # Pandas data formats
  "numpy",        # NumPy
  "pdfminer.six", # PDF
  "dpkt",         # PCAP
  "dnslib",       # PCAP DNS decoding
  "s3fs",         # S3 storage
] }
yq = "4.54.3"

# Git & version control
delta = "0.20.1"
difftastic = "0.72.0"
"cargo:forgejo-cli" = "latest"
"github:ivuorinen/gh-history" = "2026.03.0"
"github:git-ecosystem/git-credential-manager" = "3.0.2"
"github:ivuorinen/git-dirty" = "v0.2.0"
"github:shhac/git-hunk" = "0.21.1"
"github:dotzero/git-profile" = "1.9.2"      # ships macOS-all universal binary
github-cli = "2.103.3"
"npm:github-release-notes" = "0.17.3"
gitui = "0.28.1"
lazygit = "0.66.3"
"github:o2sh/onefetch" = "3.2.0"
"github:max-sixty/worktrunk" = "0.81.0"

# Editors & language servers
"npm:fish-lsp" = "1.1.5"
neovim = "0.12.6"
"npm:neovim" = "5.5.0"   # Node.js client for Neovim's RPC API (required by plugins)
# mise installs a pipx tool as <version>~uv~<hash>, and finds an exact pin
# there only through the dependency graph the global lockfile records.
# Without that lockfile it looks for <version>, so the tool counts as
# missing, stays off PATH, and every `mise install` adds another ~uv~ dir.
# "latest" resolves through the install's latest link. Pin exactly again
# once every machine has the global lockfile (see lockfile above).
"pipx:pynvim" = "latest"  # Python client; its pynvim-python is g:python3_host_prog
tree-sitter = "0.27.2"
"github:wakatime/wakatime-cli" = "2.28.4"

# AI & coding agents
"npm:ccusage" = "20.0.51"
copilot = "1.0.114"
"npm:@vshulcz/deja-vu" = "0.24.2"
# "latest" for the reason at pipx:pynvim. After an upgrade, rerun
# `graphify install --platform claude` (.claude/rules/graphify-first.md).
"pipx:graphifyy" = "latest"  # graphify, the code knowledge graph
herdr = "0.9.5"
"github:can1357/oh-my-pi" = "latest"
"npm:@tobilu/qmd" = "2.8.3"

# Task runners & caching
"github:dimo414/bkt" = "0.8.2"
just = "1.59.0"

# Test runners & git hooks
bats = "1.14.0"
lefthook = "2.2.2"
prek = "0.5.11"
shellspec = "0.28.1"

# Linters & formatters
"aqua:mpalmer/action-validator" = "0.9.0"
actionlint = "1.7.12"
# A new biome version can need its config migrated; do it on install, in
# whichever project triggered it, so biome.json never lags the pin. CI skips it
# and fails on an unmigrated config.
biome = { version = "2.6.3", postinstall = '[ -n "$CI" ] || [ ! -f "$MISE_PROJECT_ROOT/biome.json" ] || biome migrate --write --config-path="$MISE_PROJECT_ROOT/biome.json"' }
"dotnet:csharpier" = "1.3.0"
editorconfig-checker = "4.0.2"
hadolint = "2.15.1"
"npm:markdown-table-formatter" = "1.7.0"
"npm:markdownlint-cli" = "0.50.0"
# Under aube's 1000-weekly-downloads threshold (35 when added), which refuses
# the install; allow_low_downloads approves this package only.
"npm:@zabaca/mermaid-validate" = { version = "latest", allow_low_downloads = true }
"npm:prettier" = "3.9.10"
ruff = "0.17.3"
shellcheck = "0.11.0"
shfmt = "3.14.1"
"aqua:SonarSource/sonarqube-cli" = "1.12.0.17622"
taplo = "0.10.0"
"npm:v8r" = "6.1.0"
yamlfmt = "0.21.0"
yamllint = "1.38.0"

# Go linters & formatters. Used in other repos, not this one — they live here
# because dotfiles provisions the machine, not just this checkout.
#
# gofumpt/golines/revive are pinned to the github backend for the same reason
# as grype and syft below. Measured with `mise install --force`:
#
#   gofumpt  aqua: checksum   github: checksum + attestations
#   golines  aqua: checksum   github: checksum + attestations + SLSA provenance
#   revive   aqua: checksum   github: checksum + attestations + SLSA provenance
#
# gocyclo is the odd one: it publishes no release assets at all, so neither the
# registry nor the github backend can see it — the go backend is the only route,
# and it builds from source against the go entry pinned above.
"go:github.com/fzipp/gocyclo/cmd/gocyclo" = "0.6.0"
"github:mvdan/gofumpt" = "0.12.0"
golangci-lint = "2.15.0"
"github:segmentio/golines" = "0.13.0"
"github:mgechev/revive" = "1.17.1"

# Security & supply chain
#
# grype and syft are pinned to the github backend rather than left bare, because
# it is the only backend that verifies them beyond a checksum. Measured, not
# assumed — `mise install --force` prints what it actually verified:
#
#   grype   aqua: checksum        github: checksum + attestations verified
#   syft    aqua: checksum        github: checksum + attestations verified
#
# The rest of the security section stays bare on purpose, apart from the two
# entries below that say why. aqua already verifies attestations for
# age/zizmor/pinact and Cosign signatures for trivy and cosign, so moving those
# would gain nothing and cosign would actively lose its signature check. A bare
# entry also lets the registry absorb an upstream org rename — which is exactly
# how gitui moved from extrawurst to gitui-org without a config change.
age = "1.3.2"
# Python SAST. Not in mise's registry, so it comes through the pipx backend.
# The [toml] extra is required: without it bandit cannot read its config out
# of pyproject.toml and silently falls back to defaults.
"pipx:bandit[toml]" = "1.9.4"
checkov = "3.4.3"
codeql = "2.27.4"
cosign = "3.1.4"
gitleaks = "8.30.1"
gopass = "1.17.4"     # pass-compatible password manager (gopasspw/gopass)
# Go vulnerability scanner. Neither the registry nor the github backend knows
# golang/vuln, so the go backend is the only route — same case as gocyclo above.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"github:anchore/grype" = "0.121.3"
opengrep = "1.33.1"
osv-scanner = "2.7.1"
pinact = "5.0.2"
"github:anchore/syft" = "1.57.1"
trivy = "0.76.1"
trufflehog = "3.99.8"
zizmor = "1.31.1"

# System monitoring & misc utilities
bottom = "0.15.0"
cheat = "5.1.0"
"github:binwiederhier/ntfy" = "2.37.2"
rclone = "1.76.0"
jactionlint = "latest"

# Homebrew formulae and casks for mise's brew bootstrap ([bootstrap.packages])
# live in conf.d/brew/mise.macos.toml, which loads on macOS only.
