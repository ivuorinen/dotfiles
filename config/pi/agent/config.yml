images:
  blockImages: true
hideThinkingBlock: true
showHardwareCursor: false
doubleEscapeAction: tree
treeFilterMode: all
theme:
  dark: dark-gruvbox
  light: light-gruvbox
autocompleteMaxVisible: 10
steeringMode: all
followUpMode: all
startup:
  changelogMode: summary
modelRoles:
  default: anthropic/claude-opus-5-5:xhigh
symbolPreset: nerd
composer:
  shape: rule
update:
  auto: true
setupVersion: 3
tui:
  mouse: false
  tight: false
defaultThinkingLevel: xhigh
personality: default
retry:
  waitForUsageReset: true
advisor:
  enabled: true
btw:
  inject: true
branchSummary:
  enabled: true
compaction:
  handoffSaveToDisk: true
  idleEnabled: true
memory:
  backend: mnemopi
autolearn:
  enabled: true
  autoContinue: true
lsp:
  formatOnWrite: true
  diagnosticsOnEdit: true
bash:
  gitGuard: true
bashInterceptor:
  enabled: true
astGrep:
  enabled: true
checkpoint:
  enabled: true
github:
  enabled: true
security:
  enabled: true
todo:
  eager: always
  backend: native
tasks:
  todoClearDelay: 900
plan:
  autosave: true
task:
  eager: default
  steps: true
  structured: true
  isolation:
    commits: generic
  enableEffort: true
  enableLsp: true
  crossInstance: true
  maxRecursionDepth: 0
  prewalk: true
commands:
  enableClaudeUser: true
claudeResets:
  autoRedeem5h: "yes"
  autoRedeemWeekly: "yes"
  autoRedeemFable: "yes"
secrets:
  enabled: true
statusLine:
  transparent: true
tools:
  approvalMode: yolo
terminal:
  showProgress: true
display:
  cacheMissMarker: true
error:
  notify: "on"
marketplace:
  autoUpdate: auto
features:
  unexpectedStopDetection: smart
contextPromotion:
  enabled: true
mnemopi:
  recallRelevance: auto
  polyphonicRecall: true
  enhancedRecall: true
  proactiveLinking: true
mcp:
  notifications: true
