---
# Vendored graphify skill: third-party content that does not follow this
# repo's editorconfig/markdown rules. Exclude from every hook, the same
# way tools/** and other vendored trees are treated.
exclude: ^\.claude/skills/graphify/

# commit-msg is not installed by default — without it here, `prek install`
# wires only pre-commit and the commitlint hook below never runs. A fresh
# clone needs `prek install` for either stage to exist at all.
default_install_hook_types: [pre-commit, commit-msg]

# Pin every hook to pre-commit unless it opts out. A hook with no `stages`
# runs at EVERY installed stage, so installing commit-msg above would
# otherwise re-run the whole suite a second time per commit — with
# .git/COMMIT_EDITMSG as the file list, which puts commit message prose in
# front of editorconfig-checker, gitleaks and friends.
default_stages: [pre-commit]

repos:
  # Commit message convention. .commitlintrc.json extends
  # @ivuorinen/commitlint-config, which is not installed anywhere in this repo
  # (package.json declares no dependencies at all), so it is supplied here as a
  # hook dependency: prek builds a node environment holding both commitlint and
  # the config, and commitlint resolves the extends from inside it. That keeps
  # the repo's no-npm-dependencies property intact.
  #
  # The upstream manifest declares no stages, so commit-msg is set here — and
  # it is the one hook that must override default_stages above. Every other
  # hook in this file is language: system on a mise-provided binary; this one
  # is the exception because the config package has to sit on commitlint's own
  # resolution path, which a system binary cannot offer.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@ivuorinen/commitlint-config"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=auto]

  - repo: local
    hooks:
      - id: biome-check
        name: Biome Check
        entry: biome check --write --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        files: \.(js|ts|jsx|tsx|json)$
      - id: markdown-table-formatter
        name: Markdown Table Formatter
        # Mirrors the exclusion in `yarn lint:md-table`. docs/audit/findings/
        # is a tool-managed store: `findings.py index` rewrites INDEX.md with
        # unaligned tables on every run, so linting it only creates churn.
        entry: markdown-table-formatter
        language: system
        types: [markdown]
        exclude: ^docs/audit/findings/
      - id: markdownlint
        name: markdownlint
        # Mirrors `yarn lint:markdownlint` so a commit can't pass the hook
        # then fail the Stop-gate/CI. Honors .markdownlintignore.
        entry: markdownlint --ignore-path .markdownlintignore
        language: system
        types: [markdown]
      - id: editorconfig-checker
        name: EditorConfig Checker
        # Mirrors `yarn lint:ec`. Exclusions live in .editorconfig-checker.json.
        entry: ec -f gcc
        language: system
        types: [text]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: local
    hooks:
      - id: prettier
        name: Prettier (YAML)
        entry: prettier --write
        language: system
        types_or: [yaml]
      - id: v8r
        name: v8r (JSON Schema validation)
        entry: v8r
        language: system
        # Schema-backed config files only. v8r resolves schemas via
        # schemastore.org and fails the hook on any unknown property,
        # which is the whole point of adding it — see
        # .claude/rules/validate-config-schemas.md.
        files: ^(\.mega-linter\.yml|\.pre-commit-config\.yaml|biome\.json|package\.json|\.markdownlint\.json)$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        exclude: ^config/(bash/completions\.d|zsh/completions\.d)/

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        exclude: ^config/(bash/completions\.d/|zsh/completions\.d/|fzf/(key-bindings|completion)\.(bash|zsh)$)
        args: [-i, "2", -bn, -ci, -sr, -fn, -w]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # GitHub Actions security auditing. Already run by MegaLinter
  # (ACTION_ZIZMOR); this brings it to commit time too.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor

  # Secret scanning. Stronger than detect-private-key (PEM headers only);
  # covers secrets.d/ and ssh/. Scans staged changes only.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
      - id: stylua # or stylua-system / stylua-github
        exclude: hammerspoon\.types\.lua$

  - repo: https://github.com/hugoh/pre-commit-fish.git
    rev: v1.2
    hooks:
      - id: fish_syntax
      - id: fish_indent

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^config/(bash/completions\.d|zsh/completions\.d)/
      - id: ruff-format
        # ruff formats Python code blocks inside Markdown, but the upstream
        # hook only passes python/pyi/jupyter, so `ruff format --check .`
        # could fail on a rule file while every gate reported clean. The
        # repo's rule files are dense with Python snippets, hence markdown.
        types_or: [python, pyi, jupyter, markdown]
        exclude: ^config/(bash/completions\.d|zsh/completions\.d)/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        # Mirrors `yarn lint:bandit`. -c is mandatory: bandit never
        # auto-discovers pyproject.toml, and parsing TOML needs the extra.
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        # exclude_dirs in pyproject.toml only prunes directory recursion.
        # pre-commit hands bandit explicit filenames, so the vendored fish
        # helper has to be excluded here as well or it is scanned anyway.
        exclude: ^config/fish/functions/__bass\.py$

  - repo: local
    hooks:
      - id: usage-lint
        name: usage lint (scripts/ and local/bin/)
        entry: bash -c 'rc=0; for f in "$@"; do grep -q "#USAGE\|//USAGE" "$f" 2>/dev/null || continue; usage lint "$f" || rc=1; done; exit $rc' --
        language: system
        files: ^(scripts/.*\.sh|local/bin/[^/]+)$
        exclude: \.(py|pl|php|md)$
      - id: bats
        name: Bats test suite
        # ~30s, so it is scoped to paths whose behaviour the suite asserts —
        # a docs-only or workflow-only commit skips it. The whole suite runs
        # rather than the test file matching the edited script: removing the
        # python-libs step from local/bin/dfm-install broke tests/dfm.bats,
        # a pairing no filename mapping would have found.
        # See .claude/rules/run-tests-before-commit.md.
        entry: bats --print-output-on-failure tests/
        language: system
        pass_filenames: false
        files: ^(tests/|local/bin/|scripts/|base/|config/(theme/|shared\.sh|lib\.sh|exports|alias))
