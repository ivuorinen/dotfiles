---
# Copilot CLI's installed skills: third-party content that does not follow
# this repo's editorconfig/markdown rules. Exclude from every hook, the same
# way tools/** and other vendored trees are treated.
exclude: ^config/copilot/skills/

# commit-msg and pre-push are not installed by default — without them here,
# `prek install` wires only pre-commit, and the commitlint and bats hooks
# below never run. A fresh clone needs `prek install` for any stage to exist
# at all, and an existing clone needs it re-run to pick up pre-push.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

# Pin every hook to pre-commit unless it opts out. A hook with no `stages`
# runs at EVERY installed stage, so installing commit-msg above would
# otherwise re-run the whole suite a second time per commit — with
# .git/COMMIT_EDITMSG as the file list, which puts commit message prose in
# front of editorconfig-checker, gitleaks and friends.
default_stages: [pre-commit]

repos:
  # Every linter and formatter below is a `language: system` hook that runs its
  # tool through `mise exec --`, so the hook runs the version .mise/config.toml pins —
  # the same one an interactive shell, `mise run lint` and CI run. A hook repo
  # that bundles its own copy drifts from that pin: the shfmt hook repo sat a
  # release behind mise and the two formatted `! write` differently.
  #
  # Three repos stay remote, each because mise cannot provide the tool:
  #   * commitlint — see below.
  #   * pre-commit-hooks — small Python checks with no standalone binary.
  #   * pre-commit-fish — fish_indent ships with fish, and mise's fish is the
  #     bare binary without it (config/mise/config.toml explains).

  # Commit message convention. .commitlintrc.json extends
  # @ivuorinen/commitlint-config, which is not installed anywhere in this repo
  # (the repo has no package.json), so it is supplied here as a hook
  # dependency: prek builds a node environment holding both commitlint and the
  # config, and commitlint resolves the extends from inside it.
  #
  # The upstream manifest declares no stages, so commit-msg is set here — and
  # it is the one hook that must override default_stages above. The config
  # package has to sit on commitlint's own resolution path, which a system
  # binary cannot offer.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@ivuorinen/commitlint-config"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=auto]

  - repo: local
    hooks:
      - id: biome-check
        name: Biome Check
        entry: mise exec -- biome check --write --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        files: \.(js|ts|jsx|tsx|json)$
      - id: markdown-table-formatter
        name: Markdown Table Formatter
        # Mirrors the exclusion in `mise run lint-md-table`.
        # docs/audit/findings/ is a tool-managed store: `findings.py index`
        # rewrites INDEX.md with unaligned tables on every run, so linting it
        # only creates churn.
        entry: mise exec -- markdown-table-formatter
        language: system
        types: [markdown]
        exclude: ^docs/audit/findings/
      - id: markdownlint
        name: markdownlint
        # Mirrors `mise run lint-markdownlint` so a commit can't pass the hook
        # then fail the Stop-gate/CI. Honors .markdownlintignore.
        entry: mise exec -- markdownlint --ignore-path .markdownlintignore
        language: system
        types: [markdown]
      - id: editorconfig-checker
        name: EditorConfig Checker
        # Mirrors `mise run lint-ec`. Exclusions live in
        # .editorconfig-checker.json.
        entry: mise exec -- editorconfig-checker -f gcc
        language: system
        types: [text]
      - id: yamllint
        name: yamllint
        entry: mise exec -- yamllint
        language: system
        types: [file, yaml]
      - id: prettier
        name: Prettier (YAML)
        entry: mise exec -- prettier --write
        language: system
        types_or: [yaml]
      - id: v8r
        name: v8r (JSON Schema validation)
        # Every YAML/JSON/TOML file, not a hardcoded five: v8r resolves each
        # schema via schemastore.org by filename and fails the hook on any
        # unknown property — see .claude/rules/validate-config-schemas.md.
        # --ignore-errors turns "no schema found" / "multiple schemas" into
        # a pass, so only a file that validated and failed exits non-zero.
        # config/gh/ is rewritten by `gh config set`; its shape follows gh,
        # not schemastore (which rejects gh's `version: "1"`).
        # config/gh-dash/: schemastore maps it to gh-dash.dev/schema.json,
        # whose relative $refs v8r opens as local files (ENOENT), so it can
        # never validate.
        entry: mise exec -- v8r --ignore-errors
        language: system
        files: \.(ya?ml|json|toml)$
        exclude: ^(tools/|config/cheat/cheatsheets/|config/gh/|config/gh-dash/|config/pi/agent/(tmp|npm)/|node_modules/|graphify-out/|docs/audit/)
      - id: shellcheck
        name: shellcheck
        entry: mise exec -- shellcheck
        language: system
        types: [shell]
        # shellcheck can follow `source` only when it sees the files together.
        require_serial: true
        exclude: ^config/(bash/completions\.d|zsh/completions\.d)/
      - id: shfmt
        name: shfmt
        entry: mise exec -- shfmt -i 2 -bn -ci -sr -fn -w
        language: system
        types: [shell]
        exclude_types: [csh, tcsh]
        exclude: ^config/(bash/completions\.d|zsh/completions\.d)/
      - id: actionlint
        name: actionlint
        entry: mise exec -- actionlint
        language: system
        types: [yaml]
        files: ^\.github/workflows/
      # GitHub Actions security auditing. Already run by MegaLinter
      # (ACTION_ZIZMOR); this brings it to commit time too. The files filter
      # is upstream's: workflows, dependabot config, action.yml and the
      # pre-commit configs.
      - id: zizmor
        name: zizmor
        entry: mise exec -- zizmor --no-progress
        language: system
        types: [yaml]
        files: (^|/)(\.github/(workflows/[^/]+|dependabot)\.ya?ml|action\.ya?ml|\.pre-commit-(config|hooks)\.ya?ml)$
        require_serial: true
      # Secret scanning. Stronger than detect-private-key (PEM headers only);
      # covers secrets.d/ and ssh/. Scans staged changes only.
      - id: gitleaks
        name: Detect hardcoded secrets
        entry: mise exec -- gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false
      - id: stylua
        name: StyLua
        entry: mise exec -- stylua
        language: system
        types: [lua]
        exclude: hammerspoon\.types\.lua$
      - id: ruff-check
        name: ruff check
        entry: mise exec -- ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        exclude: ^config/(bash/completions\.d|zsh/completions\.d)/
      - id: ruff-format
        name: ruff format
        # ruff formats Python code blocks inside Markdown, but upstream's hook
        # only passed python/pyi/jupyter, so `ruff format --check .` could fail
        # on a rule file while every gate reported clean. The repo's rule files
        # are dense with Python snippets, hence markdown.
        entry: mise exec -- ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
        exclude: ^config/(bash/completions\.d|zsh/completions\.d)/
      - id: bandit
        name: bandit
        # Mirrors `mise run lint-bandit`. -c is mandatory: bandit never
        # auto-discovers pyproject.toml, and parsing TOML needs the [toml]
        # extra that .mise/config.toml installs.
        entry: mise exec -- bandit -c pyproject.toml
        language: system
        types: [python]
        require_serial: true
        # exclude_dirs in pyproject.toml only prunes directory recursion.
        # pre-commit hands bandit explicit filenames, so the vendored fish
        # helper has to be excluded here as well or it is scanned anyway.
        exclude: ^config/fish/functions/__bass\.py$

  - repo: https://github.com/hugoh/pre-commit-fish.git
    rev: v1.2
    hooks:
      - id: fish_syntax
      - id: fish_indent

  - repo: local
    hooks:
      - id: usage-lint
        name: usage lint (scripts/ and local/bin/)
        entry: mise exec -- bash -c 'rc=0; for f in "$@"; do grep -q "#USAGE\|//USAGE" "$f" 2>/dev/null || continue; usage lint "$f" || rc=1; done; exit $rc' --
        language: system
        files: ^(scripts/.*\.sh|local/bin/[^/]+)$
        exclude: \.(py|pl|php|md)$
      - id: bats
        name: Bats test suite
        # ~5min for 1280 tests. It runs on push, not per commit: paying that
        # on every commit made splitting work into small commits cost five
        # minutes each, and CI (.github/workflows/tests.yml) runs it again on
        # every PR. At pre-push the files filter below sees every file the
        # pushed commits change, so a push of docs-only or workflow-only
        # commits skips it. The whole suite runs rather than the test file
        # matching the edited script: removing the python-libs step from
        # local/bin/dfm-install broke tests/dfm.bats, a pairing no filename
        # mapping would have found.
        #
        # Most of the cost is spread flat across 91 files (slowest is
        # git-dirty at 25s), not one hot spot, so there is nothing left to
        # fix by tuning a single test. `bats --jobs` would cut it to roughly
        # a minute on this 10-core machine, but it needs GNU parallel and
        # /opt/homebrew/bin/parallel is moreutils' incompatible namesake,
        # pinned as brew:moreutils in config/mise/conf.d/brew/mise.toml.
        # Resolving that collision is a deliberate decision, not a drive-by.
        # See .claude/rules/run-tests-before-push.md.
        #
        # env -u: git exports GIT_INDEX_FILE and friends to its hooks whenever
        # the commit builds a temporary index — `git commit <path>` and
        # `git-hunk commit` both do. A fixture repo that inherits them writes
        # into the pending commit's index instead of its own, which fails the
        # test ("invalid object … Error building trees") and can corrupt the
        # commit itself. The suite's setup() functions unset these too; this is
        # the boundary that holds for a test file that forgets.
        #
        # scripts/bats-run.sh runs `bats --print-output-on-failure` and ends
        # with one block listing every failing test as file:line, so a
        # `not ok` is not lost among ~1000 lines of hook output.
        entry: mise exec -- env -u GIT_INDEX_FILE -u GIT_DIR -u GIT_WORK_TREE -u GIT_OBJECT_DIRECTORY
          -u GIT_COMMON_DIR -u GIT_PREFIX scripts/bats-run.sh tests/
        language: system
        pass_filenames: false
        stages: [pre-push]
        # .claude/hooks/ and vendored-files.md are here so an edit to either
        # protected-path list runs tests/protected-paths-parity.bats.
        files: ^(tests/|local/bin/|scripts/|base/|config/(theme/|shared\.sh|lib\.sh|exports|alias)|\.claude/hooks/|\.claude/rules/vendored-files\.md$)
      - id: rules-lint
        name: .claude/rules lint (hedge words, frontmatter keys)
        # Commit-time twin of the pre-rules-lint.sh PreToolUse hook: catches
        # rule files changed through Bash or the ctx sandbox, where no edit
        # hook fires.
        entry: .claude/hooks/lib/rules-lint.sh
        language: system
        files: ^\.claude/rules/.*\.md$
      - id: claude-md-length
        name: CLAUDE.md and AGENTS.md at most 200 lines
        entry: bash -c 'rc=0; for f; do n=$(wc -l < "$f"); [ "$n" -le 200 ] || { echo "$f has $n lines, limit 200"; rc=1; }; done; exit $rc' --
        language: system
        files: (^|/)(CLAUDE|AGENTS)\.md$
      - id: host-leak-check
        name: No host names or ~/Code paths added to shared config
        entry: scripts/check-host-leak.sh
        language: system
        files: ^(config|base|ssh)/
      - id: keymap-desc
        name: Neovim K.* keymaps carry a description
        entry: scripts/check-keymap-desc.py
        language: system
        files: ^config/nvim/.*\.lua$
