---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Tests

# yamllint disable-line
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bats:
    name: Bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install fish and zsh (Linux)
        if: runner.os == 'Linux'
        # fish stays a distro package: the mise fish tarball ships no
        # fish_indent (config/mise/conf.d/brew/mise.toml).
        # zsh: zsh-antidote.bats runs zshrc and antidote.zsh under zsh itself.
        # macOS ships it; the Ubuntu image does not.
        run: |
          sudo apt-get update
          sudo apt-get install -y fish zsh

      - name: Install fish, bash and coreutils (macOS)
        if: runner.os == 'macOS'
        # bash: the runner's /bin/bash is 3.2 and dfm's full bootstrap
        # requires 4+; coreutils: gtimeout for the theme actor's 5s kill;
        # fish: see the Linux step
        run: |
          brew install fish bash coreutils

      # The pins live in .mise.toml, which mirrors config/mise/config.toml, so
      # the suite runs on the versions the dotfiles install. install_args
      # limits mise to these tools instead of the whole .mise.toml toolchain.
      # No mise_toml input: mise merges it with .mise.toml rather than
      # replacing it, and .mise.toml wins wherever both pin a tool.
      # python: .mise.toml pins it, which makes it an install dependency of
      # the pypi-backed yamllint; without it, installing yamllint fails.
      # shfmt: the agent policy hooks parse every command with
      # `shfmt --to-json` and fail closed without it; only 3.14.0+ writes
      # operators as strings, and apt ships 3.8.
      # uv: x-compare-versions.py runs under `uv run --script`, which
      # installs the script's inline dependencies itself.
      # tmux, yamllint: the theme tests skip without them — the tmux
      # reload-recursion and 5 s budget guards, and the palette parse checks.
      # age: the a/ad/ae real-age round-trip tests skip without it, and they
      # are the only tests that prove an encrypted file decrypts.
      - name: Install pinned tools
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: python shfmt uv age bats tmux yamllint

      - name: Run test suite
        # scripts/bats-run.sh is the same runner as the pre-commit hook:
        # bats --print-output-on-failure (without it a failing assertion is
        # all the log shows, and the script's own output — the part that says
        # why — is thrown away), then a list of every failing test. Under
        # Actions each failure is also an ::error annotation on the PR diff
        # at the test's file:line, and a table in the job summary.
        run: scripts/bats-run.sh tests/

  lint:
    name: Lint (mise run lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # linters.yml only runs on pull_request, so without this job a commit
      # pushed straight to main is never linted server-side.
      - name: Install the mise toolchain
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Run lint
        run: mise run lint

  fish-lint:
    name: Fish syntax and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install fish
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Check fish syntax and formatting
        run: |
          rc=0
          while IFS= read -r f; do
            fish -n "$f" || rc=1
            fish_indent --check "$f" || { echo "needs formatting: $f"; rc=1; }
          done < <(git ls-files '*.fish')
          exit "$rc"
