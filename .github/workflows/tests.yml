---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Tests

# yamllint disable-line
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bats:
    name: Bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats and fish (Linux)
        if: runner.os == 'Linux'
        # python3-packaging: x-compare-versions.py imports it. Locally mise
        # installs it from config/mise/default-python-packages; this job has
        # no mise, so it has to come from the package manager.
        # tmux, yamllint: the theme tests skip without them — the tmux
        # reload-recursion and 5 s budget guards, and the palette parse checks.
        # age: the a/ad/ae real-age round-trip tests skip without it, and they
        # are the only tests that prove an encrypted file decrypts.
        # zsh: zsh-antidote.bats runs zshrc and antidote.zsh under zsh itself.
        # macOS ships it; the Ubuntu image does not.
        run: |
          sudo apt-get update
          sudo apt-get install -y age bats fish python3-packaging tmux yamllint zsh

      - name: Install bats and fish (macOS)
        if: runner.os == 'macOS'
        # bash: the runner's /bin/bash is 3.2 and dfm's full bootstrap
        # requires 4+; coreutils: gtimeout for the theme actor's 5s kill;
        # age, tmux, yamllint: see the Linux step
        run: |
          brew install age bats-core fish bash coreutils tmux yamllint
          python3 -m pip install --break-system-packages packaging \
            || python3 -m pip install packaging

      # The agent policy hooks parse every command with `shfmt --to-json`
      # and fail closed without shfmt. Only 3.14.0+ writes operators as
      # strings (earlier releases emit enum numbers), and apt ships 3.8, so
      # mise installs the version config/mise/config.toml pins. install_args
      # limits it to shfmt instead of the whole .mise.toml toolchain.
      - name: Install shfmt
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          mise_toml: |
            [tools]
            shfmt = "3.14.1"
          install_args: shfmt

      - name: Run test suite
        # scripts/bats-run.sh is the same runner as the pre-commit hook:
        # bats --print-output-on-failure (without it a failing assertion is
        # all the log shows, and the script's own output — the part that says
        # why — is thrown away), then a list of every failing test. Under
        # Actions each failure is also an ::error annotation on the PR diff
        # at the test's file:line, and a table in the job summary.
        run: scripts/bats-run.sh tests/

  lint:
    name: Lint (yarn lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # linters.yml only runs on pull_request, so without this job a commit
      # pushed straight to main is never linted server-side.
      - name: Install the mise toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - name: Enable corepack for the pinned yarn
        run: corepack enable

      - name: Run lint
        run: yarn lint

  fish-lint:
    name: Fish syntax and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install fish
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Check fish syntax and formatting
        run: |
          rc=0
          while IFS= read -r f; do
            fish -n "$f" || rc=1
            fish_indent --check "$f" || { echo "needs formatting: $f"; rc=1; }
          done < <(git ls-files '*.fish')
          exit "$rc"
