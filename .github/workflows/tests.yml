---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Tests

# yamllint disable-line
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bats:
    name: Bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install fish and zsh (Linux)
        if: runner.os == 'Linux'
        # fish stays a distro package: the mise fish tarball ships no
        # fish_indent (config/mise/conf.d/brew/mise.macos.toml).
        # zsh: zsh-antidote.bats runs zshrc and antidote.zsh under zsh itself.
        # macOS ships it; the Ubuntu image does not.
        run: |
          sudo apt-get update
          sudo apt-get install -y fish zsh

      - name: Install fish, bash and coreutils (macOS)
        if: runner.os == 'macOS'
        # bash: the runner's /bin/bash is 3.2 and dfm's full bootstrap
        # requires 4+; coreutils: gtimeout for the theme actor's 5s kill;
        # fish: see the Linux step
        run: |
          brew install fish bash coreutils

      # The pins live in .mise/config.toml, which mirrors
      # config/mise/config.toml, so the suite runs on the versions the
      # dotfiles install. install_args limits mise to these tools instead of
      # the whole .mise/config.toml toolchain. No mise_toml input: mise merges
      # it with .mise/config.toml rather than replacing it, and
      # .mise/config.toml wins wherever both pin a tool.
      # python: .mise/config.toml pins it, which makes it an install dependency of
      # the pypi-backed yamllint; without it, installing yamllint fails.
      # shfmt: the agent policy hooks parse every command with
      # `shfmt --to-json` and fail closed without it; only 3.14.0+ writes
      # operators as strings, and apt ships 3.8.
      # uv: x-compare-versions.py runs under `uv run --script`, which
      # installs the script's inline dependencies itself.
      # tmux, yamllint: the theme tests skip without them — the tmux
      # reload-recursion and 5 s budget guards, and the palette parse checks.
      # age: the a/ad/ae real-age round-trip tests skip without it, and they
      # are the only tests that prove an encrypted file decrypts.
      # jq: every .claude/hooks script parses its JSON input with it, so the
      # hook suites need it, as do the herdr, theme and gh helper tests. The
      # runner image happens to ship one; this pins it.
      - name: Install pinned tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python shfmt uv age bats tmux yamllint jq

      - name: Run test suite
        # scripts/bats-run.sh is the same runner as the pre-commit hook:
        # bats --print-output-on-failure (without it a failing assertion is
        # all the log shows, and the script's own output — the part that says
        # why — is thrown away), then a list of every failing test. Under
        # Actions each failure is also an ::error annotation on the PR diff
        # at the test's file:line, and a table in the job summary.
        run: scripts/bats-run.sh tests/

  lint:
    # The name is the main ruleset's required status check: renaming the job
    # blocks every PR until the ruleset is changed to match.
    name: Lint (mise run lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The branch itself, not the PR merge ref, so a fix commit can land on
      # it. No credentials persist: only the push step below sees a token,
      # after every tool the branch controls has finished running.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false

      # linters.yml only runs on pull_request, so without this job a commit
      # pushed straight to main is never linted server-side.
      - name: Install the mise toolchain
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Run autofixers
        run: mise run fix

      # fiximus pushes with its own token because a push made with
      # GITHUB_TOKEN starts no workflow run, and the fixed commit needs one.
      # On main it is on the ruleset's bypass list. Fork PRs get
      # no secrets, and a run fiximus started must not push again (a fixer
      # that is not idempotent would loop), so both fail with the diff.
      - name: Commit fixes as fiximus
        env:
          FIXIMUS_TOKEN: ${{ secrets.FIXIMUS_TOKEN }}
          REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          if [ -z "$FIXIMUS_TOKEN" ] || [ "$GITHUB_ACTOR" = fiximus ]; then
            git diff --stat
            echo "::error::mise run fix changed files that this run cannot push; run it locally"
            exit 1
          fi
          git config user.name fiximus
          git config user.email 189535814+fiximus@users.noreply.github.com
          git commit --all --message "style: apply autofixers (automated)"
          git push "https://x-access-token:${FIXIMUS_TOKEN}@github.com/${REPO}.git" "HEAD:${REF}"

      # Catches what no fixer can: editorconfig, schemas, usage, bandit and
      # exclusion drift.
      - name: Run lint
        run: mise run lint

  fish-lint:
    name: Fish syntax and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install fish
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Check fish syntax and formatting
        run: |
          rc=0
          while IFS= read -r f; do
            fish -n "$f" || rc=1
            fish_indent --check "$f" || { echo "needs formatting: $f"; rc=1; }
          done < <(git ls-files '*.fish')
          exit "$rc"
