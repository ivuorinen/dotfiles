# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Tests

# yamllint disable-line
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bats:
    name: Bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats and fish (Linux)
        if: runner.os == 'Linux'
        # python3-packaging: x-compare-versions.py imports it. Locally mise
        # installs it from config/mise/default-python-packages; this job has
        # no mise, so it has to come from the package manager.
        run: |
          sudo apt-get update
          sudo apt-get install -y bats fish python3-packaging

      - name: Install bats and fish (macOS)
        if: runner.os == 'macOS'
        # bash: the runner's /bin/bash is 3.2 and dfm's full bootstrap
        # requires 4+; coreutils: gtimeout for the theme actor's 5s kill
        run: |
          brew install bats-core fish bash coreutils
          python3 -m pip install --break-system-packages packaging \
            || python3 -m pip install packaging

      - name: Run test suite
        # --print-output-on-failure matches the pre-commit hook. Without it a
        # failing assertion is all the log shows, and the script's own output
        # — the part that says why — is thrown away.
        run: bats --print-output-on-failure tests/

  lint:
    name: Lint (yarn lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # linters.yml only runs on pull_request, so without this job a commit
      # pushed straight to main is never linted server-side.
      - name: Install the mise toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Enable corepack for the pinned yarn
        run: corepack enable

      - name: Run lint
        run: yarn lint

  fish-lint:
    name: Fish syntax and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install fish
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Check fish syntax and formatting
        run: |
          rc=0
          while IFS= read -r f; do
            fish -n "$f" || rc=1
            fish_indent --check "$f" || { echo "needs formatting: $f"; rc=1; }
          done < <(git ls-files '*.fish')
          exit "$rc"
