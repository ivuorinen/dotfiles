---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Update submodules

on:
  schedule:
    # At 04:00 on Monday and Thursday.
    - cron: "0 4 * * 1,4"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-submodules:
    name: "Update git submodules"
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      # persist-credentials MUST stay true: "Update submodules" ends in a raw
      # `git push`, which needs the token persisted in git's config. The
      # token: input only authenticates the initial clone, not later pushes.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Config Git User
        shell: bash
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      # The foreach body is single-quoted so each submodule's shell evaluates
      # it. A double-quoted body is expanded once here in the superproject,
      # where there are no tags: every describe failed, $tag was empty, and
      # the job reported "No updates" from 2025-02 on while updating nothing.
      # Tagless submodules (the cheatsheets) are skipped.
      # The body sets -e itself: foreach runs it in its own sh, which does not
      # inherit this step's bash -e, so a failed fetch or checkout would
      # otherwise fall through to the "updated" message.
      #
      # checkout clones submodules with --depth=2 (its fetch-depth), and a
      # plain `fetch --tags` adds the tag refs without deepening the graft, so
      # describe stopped at the shallow boundary before the latest tag and the
      # job logged every tagged submodule as "no tags". Each submodule is
      # unshallowed first, and a describe failure on a tagged submodule now
      # fails the step instead of being reported as tagless.
      #
      # Changes go to a PR from $BRANCH, not straight to main: main requires
      # status checks, and a GITHUB_TOKEN push cannot bypass branch
      # protection. A PR opened with GITHUB_TOKEN triggers no workflows, so its
      # checks never report and an admin merges it. The branch is rebuilt from
      # main on every run, so the force push refreshes a PR left open.
      # Every tagged submodule follows its default branch's newest tag, major
      # bumps included and with no per-submodule exceptions: a tag is the
      # upstream's own release point, so the pin is always a release. A pin
      # sitting on untagged commits is moved to that tag too.
      - name: Update submodules
        shell: bash
        env:
          BRANCH: chore/update-submodules
          GH_TOKEN: ${{ github.token }}
        run: |
          git submodule sync
          # shellcheck disable=SC2016 # expansion must happen per submodule
          git submodule foreach --quiet '
            set -e
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --quiet --tags --unshallow origin
            else
              git fetch --quiet --tags origin
            fi
            if [ -z "$(git tag --list)" ]; then
              echo "$name: no tags, skipped"
              exit 0
            fi
            tag="$(git describe --tags --abbrev=0 origin/HEAD)" || exit 1
            [ "$(git describe --tags)" != "$tag" ] || exit 0
            git checkout --quiet "$tag"
            echo "$name updated to $tag"
          '

          if git diff --quiet; then
            echo "No updates for submodules."
            exit 0
          fi
          git switch --quiet --force-create "$BRANCH"
          # --update stages only tracked paths (the submodule pointers),
          # never stray untracked files in the runner's checkout.
          git add --update
          git commit -m "chore(git): Update submodules (automated)"
          git show --raw
          git push --force origin "$BRANCH"
          open_pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$open_pr" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(git): Update submodules (automated)" \
              --body "Moves each tagged submodule to its newest tag. Opened with GITHUB_TOKEN, so no checks run on it; merge it as an admin."
          fi
