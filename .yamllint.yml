---
extends: default

ignore: |
  .mise/locks
  .mypy_cache
  Brewfile.lock.json
  config/cheat/cheatsheets/community
  config/cheat/cheatsheets/tldr
  config/mise/locks
  config/nvim
  config/op/plugins/used_plugins
  config/pi/agent/npm
  config/pi/agent/tmp
  config/tmux/plugins
  config/vim/extra
  config/vim/plugged
  config/zsh
  lazy-lock.json
  local/bin/antigen.zsh
  local/bin/asdf
  node_modules
  tools

rules:
  empty-lines:
    level: warning
    max: 1
  line-length:
    max: 200
    level: warning
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  trailing-spaces:
    level: warning
