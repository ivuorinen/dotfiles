---
# This project declares no npm dependencies at all: package.json has no
# dependencies/devDependencies block, yarn.lock holds no git resolutions, and
# every linter and formatter comes from mise instead. Yarn is a task runner
# here. The settings below keep that surface closed rather than leaving the
# permissive values a dependency-heavy project would need.

# Yarn blocks any git dependency whose URL matches none of these patterns.
# An empty list means a git dependency cannot be introduced without this file
# changing in the same commit. The previous value, "**", approved every
# repository on the internet.
approvedGitRepositories: []

# Yarn's own default is false; this was previously set to an explicit true,
# which let any package run postinstall code. That matters here because the
# Stop-gate hook (.claude/hooks/stop-lint-gate.sh) runs `yarn install
# --no-immutable` on every turn, so a postinstall script would execute
# unattended. Re-enable per package via dependenciesMeta if one ever needs it.
enableScripts: false

nodeLinker: node-modules

# Minimum publish age before a version is installable. The documented form is
# a duration string ("1w"); the previous value was the bare number 3, whose
# unit the setting's documentation does not define. One week covers the window
# in which compromised and typosquatted releases are normally caught and
# yanked, and matches Semgrep's yarn-missing-minimal-age-gate threshold.
npmMinimalAgeGate: "1w"
