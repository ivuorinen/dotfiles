# SonarQube Cloud automatic analysis configuration.
#
# This file — NOT sonar-project.properties — is what automatic analysis
# reads. Automatic analysis ignores sonar-project.properties entirely; that
# one is only for CI-based analysis.
#
# Everything excluded here is third-party code this repo does not author and
# is forbidden from editing (.claude/rules/vendored-files.md, and submodules
# refreshed with `git submodule update`). Issues raised against it are not
# actionable: the next upstream sync would discard any fix.

sonar.exclusions=tools/**/*,config/cheat/cheatsheets/**/*,.claude/skills/graphify/**/*,local/bin/fzf-tmux,local/bin/iterm2_shell_integration.zsh,config/fzf/completion.bash,config/fzf/completion.zsh,config/fzf/key-bindings.bash,config/fzf/key-bindings.zsh,config/fzf/key-bindings.fish,config/bash/completions.d/**/*,config/zsh/completions.d/**/*
